version: '3.8'

services:
  vertaflow:
    build: .
    container_name: vertaflow_closer
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./vertaflow.db:/app/vertaflow.db
      - ./static:/app/static
